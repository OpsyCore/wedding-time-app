name: wedding_time
description: Wedding Planner App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  firebase_core: ^3.8.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.7

  shared_preferences: ^2.2.2
  table_calendar: ^3.0.9
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  http: ^1.2.2
  path: ^1.9.0
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

# یک عکس در assets/icon/app_icon.png بگذار و بزن:
#   dart run flutter_launcher_icons
# خودش همهٔ سایزهای اندروید/iOS/وب را می‌سازد.
flutter_launcher_icons:
  android: true # همان ic_launcher فعلی
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0D0C1A"
    theme_color: "#0D0C1A"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/audio/ambient/

  fonts:
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-Regular.ttf
          weight: 400
        - asset: assets/fonts/Estedad-Medium.ttf
          weight: 500
        - asset: assets/fonts/Estedad-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Estedad-Bold.ttf
          weight: 700