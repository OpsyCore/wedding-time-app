name: apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          java -version
          echo "---"
          cat pubspec.yaml | head -20

      - name: Flutter doctor (diagnostics only)
        run: flutter doctor -v || true

      - name: Run build regression tests
        run: flutter test test/build_regression_test.dart

      - name: Cache Android debug keystore for consistent APK signing
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK (split per ABI, consistent signing)
        id: build
        env:
          IMGBB_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          set -o pipefail
          DEFINE_ARGS=()
          if [ -n "${IMGBB_KEY}" ]; then
            DEFINE_ARGS+=(--dart-define=IMGBB_API_KEY="${IMGBB_KEY}")
          fi
          flutter build apk --release --split-per-abi --build-number="${{ github.run_number }}" "${DEFINE_ARGS[@]}" 2>&1 | tee /tmp/build.log
          ls -lh build/app/outputs/flutter-apk/app-*-release.apk

      # خطاها را به‌صورت annotation در صفحهٔ Actions و در API قابل‌خواندن می‌کند
      # (لاگ خام آرتیفکت روی برخی شبکه‌ها در دسترس نیست)
      - name: Report build errors as annotations
        if: failure()
        run: |
          echo "===== first compiler/build errors ====="
          grep -n -E "Error:|error:|FAILURE:|What went wrong|> Task .* FAILED|Could not|not found" /tmp/build.log | head -30 || true
          echo "===== tail ====="
          tail -n 120 /tmp/build.log || true
          echo "===== annotations ====="
          grep -m 10 -E "^[^ ]*\.dart:[0-9]+:[0-9]+: Error:" /tmp/build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if ! grep -q -E "^[^ ]*\.dart:[0-9]+:[0-9]+: Error:" /tmp/build.log; then
            grep -m 5 -E "What went wrong|FAILURE:|Execution failed|A problem occurred" /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish APK as GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "نصب روی اندروید — APK #${{ github.run_number }}"
          body: |
            نسخهٔ Release کم‌حجم (تفکیک‌شده بر اساس پردازنده):
            - **تقریباً همهٔ گوشی‌های اندرویدی جدید (۶۴ بیتی):** فایل `app-arm64-v8a-release.apk` را دانلود و نصب کنید.
            - **گوشی‌های قدیمی‌تر ۳۲ بیتی:** فایل `app-armeabi-v7a-release.apk`
            - **شبیه‌ساز کامپیوتر (x86_64):** فایل `app-x86_64-release.apk`

            (هنگام نصب، پیغام «منبع ناشناخته / Install unknown apps» را تأیید کنید.)
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          make_latest: "true"
