name: apk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          java -version
          echo "---"
          cat pubspec.yaml | head -20

      - name: Flutter doctor (diagnostics only)
        run: flutter doctor -v || true

      - name: Build debug APK (installable without keystore)
        id: build
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build.log

      # خطاها را به‌صورت annotation در صفحهٔ Actions و در API قابل‌خواندن می‌کند
      # (لاگ خام آرتیفکت روی برخی شبکه‌ها در دسترس نیست)
      - name: Report build errors as annotations
        if: failure()
        run: |
          echo "===== first compiler/build errors ====="
          grep -n -E "Error:|error:|FAILURE:|What went wrong|> Task .* FAILED|Could not|not found" /tmp/build.log | head -30 || true
          echo "===== tail ====="
          tail -n 120 /tmp/build.log || true
          echo "===== annotations ====="
          grep -m 10 -E "^[^ ]*\.dart:[0-9]+:[0-9]+: Error:" /tmp/build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if ! grep -q -E "^[^ ]*\.dart:[0-9]+:[0-9]+: Error:" /tmp/build.log; then
            grep -m 5 -E "What went wrong|FAILURE:|Execution failed|A problem occurred" /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish APK as GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "نصب روی اندروید — APK #${{ github.run_number }}"
          body: |
            فایل app-debug.apk را دانلود و روی گوشی اندرویدی نصب کنید
            (پیغام «منبع ناشناخته» را تأیید کنید).
          files: build/app/outputs/flutter-apk/app-debug.apk
          make_latest: "true"
