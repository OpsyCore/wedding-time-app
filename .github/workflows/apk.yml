name: apk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK (installable without keystore)
        run: flutter build apk --debug

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "نصب روی اندروید — APK #${{ github.run_number }}"
          body: |
            فایل app-debug.apk را دانلود و روی گوشی اندرویدی نصب کنید
            (پیغام «منبع ناشناخته» را تأیید کنید).
          files: build/app/outputs/flutter-apk/app-debug.apk
          make_latest: "true"
