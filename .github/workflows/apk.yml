name: apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          java -version
          echo "---"
          cat pubspec.yaml | head -20

      - name: Flutter doctor (diagnostics only)
        run: flutter doctor -v || true

      - name: Validate Bazaar purchase backend
        working-directory: functions
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm audit --omit=dev --audit-level=moderate

      - name: Resolve Flutter dependencies
        run: flutter pub get

      # flutter_poolakey 2.2.0+1.0.0 still calls the removed Gradle jcenter() DSL.
      # Resolve its exact source through pub's package config and patch it until
      # the upstream package releases a compatible Gradle build file.
      - name: Patch legacy Poolakey Gradle repository
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          config = json.loads(Path('.dart_tool/package_config.json').read_text())
          package = next((item for item in config['packages']
                          if item['name'] == 'flutter_poolakey'), None)
          if package is None:
              raise SystemExit('flutter_poolakey was not found in package_config.json')
          root_uri = package['rootUri']
          parsed = urlparse(root_uri)
          root = (Path(unquote(parsed.path)) if parsed.scheme == 'file'
                  else (Path('.dart_tool') / root_uri).resolve())
          gradle_file = root / 'android' / 'build.gradle'
          if not gradle_file.is_file():
              raise SystemExit(f'Poolakey Gradle file not found: {gradle_file}')
          text = gradle_file.read_text()
          if 'jcenter()' not in text:
              raise SystemExit(f'Expected legacy jcenter() call was not found: {gradle_file}')
          gradle_file.write_text(text.replace('jcenter()', 'mavenCentral()'))
          if 'jcenter()' in gradle_file.read_text():
              raise SystemExit(f'Could not remove jcenter() from {gradle_file}')
          print(f'Patched {gradle_file}')
          PY

      - name: Run build regression tests
        run: flutter test test/build_regression_test.dart

      - name: Cache Android release keystore for consistent store APK signing
        uses: actions/cache@v6
        with:
          path: ~/.android/release-keystore
          key: android-release-keystore-v1

      - name: Ensure Android release keystore and key.properties exist
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS_ENV: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          mkdir -p ~/.android/release-keystore
          KS_PATH="$HOME/.android/release-keystore/upload-keystore.jks"
          SP="${STORE_PASS:-WeddingTimeRelease2026}"
          KP="${KEY_PASS:-WeddingTimeRelease2026}"
          KA="${KEY_ALIAS_ENV:-upload}"

          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 --decode > "${KS_PATH}"
          elif [ ! -f "${KS_PATH}" ]; then
            keytool -genkeypair -v \
              -keystore "${KS_PATH}" \
              -storetype PKCS12 \
              -storepass "${SP}" \
              -alias "${KA}" \
              -keypass "${KP}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Wedding Time, OU=Mobile, O=OpsyCore, L=Tehran, S=Tehran, C=IR"
          fi

          cp "${KS_PATH}" android/upload-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "${SP}" "${KP}" "${KA}" > android/key.properties

      - name: Build release APK (split per ABI, signed with release key)
        id: build
        env:
          IMGBB_KEY: ${{ secrets.IMGBB_API_KEY }}
          BAZAAR_RSA_PUBLIC_KEY: ${{ vars.BAZAAR_RSA_PUBLIC_KEY }}
        run: |
          set -o pipefail
          DEFINE_ARGS=()
          if [ -n "${IMGBB_KEY}" ]; then
            DEFINE_ARGS+=(--dart-define=IMGBB_API_KEY="${IMGBB_KEY}")
          fi
          if [ -n "${BAZAAR_RSA_PUBLIC_KEY}" ]; then
            DEFINE_ARGS+=(--dart-define=BAZAAR_RSA_PUBLIC_KEY="${BAZAAR_RSA_PUBLIC_KEY}")
          fi
          flutter build apk --release --split-per-abi --build-number="${{ github.run_number }}" "${DEFINE_ARGS[@]}" 2>&1 | tee /tmp/build.log
          flutter build apk --release --build-number="${{ github.run_number }}" "${DEFINE_ARGS[@]}" 2>&1 | tee -a /tmp/build.log
          ls -lh build/app/outputs/flutter-apk/*.apk
          echo "=== Verifying APK Release Signature ==="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -n 15

      # خطاها را به‌صورت annotation در صفحهٔ Actions و در API قابل‌خواندن می‌کند
      # (لاگ خام آرتیفکت روی برخی شبکه‌ها در دسترس نیست)
      - name: Report build errors as annotations
        if: failure()
        run: |
          echo "===== first compiler/build errors ====="
          grep -n -E "Error:|error:|FAILURE:|What went wrong|> Task .* FAILED|Could not|not found" /tmp/build.log | head -30 || true
          echo "===== tail ====="
          tail -n 120 /tmp/build.log || true
          echo "===== annotations ====="
          grep -m 10 -E "^[^ ]*\.dart:[0-9]+:[0-9]+: Error:" /tmp/build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if ! grep -q -E "^[^ ]*\.dart:[0-9]+:[0-9]+: Error:" /tmp/build.log; then
            grep -m 5 -E "What went wrong|FAILURE:|Execution failed|A problem occurred" /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/build.log').read_text(errors='replace').splitlines()
          for index, line in enumerate(lines):
              if 'What went wrong:' not in line:
                  continue
              details = []
              for candidate in lines[index + 1:index + 9]:
                  text = candidate.strip()
                  if not text:
                      if details:
                          break
                      continue
                  if text.startswith('Try:'):
                      break
                  details.append(text)
              for detail in details:
                  print(f'::error title=Build failure details::{detail}')
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish APK as GitHub Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: "نصب روی اندروید — APK #${{ github.run_number }}"
          body: |
            نسخهٔ Release کم‌حجم (تفکیک‌شده بر اساس پردازنده):
            - **تقریباً همهٔ گوشی‌های اندرویدی جدید (۶۴ بیتی):** فایل `app-arm64-v8a-release.apk` را دانلود و نصب کنید.
            - **گوشی‌های قدیمی‌تر ۳۲ بیتی:** فایل `app-armeabi-v7a-release.apk`
            - **شبیه‌ساز کامپیوتر (x86_64):** فایل `app-x86_64-release.apk`

            (هنگام نصب، پیغام «منبع ناشناخته / Install unknown apps» را تأیید کنید.)
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          make_latest: "true"
