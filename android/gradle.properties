org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Build speed — parallel module compilation + build cache.
# The first build stays slow (NDK compile of :jni is unavoidable), but every
# build after that reuses the cache and only recompiles what changed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
kotlin.incremental=true
org.gradle.configureondemand=false

# Longer HTTP timeouts — avoids "Read timed out" on slow / mirrored networks
# (Aliyun mirrors, VPN, hotel wifi, etc.). Values are milliseconds.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.socketTimeout=120000
